name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Check for unused code
        run: npx knip
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check for unused exports
        run: npm run ts-prune
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Auth0
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_BASE_URL: ${{ secrets.AUTH0_BASE_URL }}
          AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          # AI Services
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # AI Intranet URLs
          AI_INTRANET_URL_LOCAL: ${{ secrets.AI_INTRANET_URL_LOCAL }}
          AI_INTRANET_URL_PROD: ${{ secrets.AI_INTRANET_URL_PROD }}

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Security scanning with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript, typescript'
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Check for secrets
        run: |
          if grep -r "ANTHROPIC_API_KEY\|AUTH0_SECRET\|SUPABASE_KEY" lib/ components/ app/ --include="*.ts" --include="*.tsx" | grep -v node_modules | grep -v ".next" | grep -v "process.env"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi
        continue-on-error: true

  performance:
    name: Performance & Accessibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DISABLE_AUTH: 'true'

      - name: Analyze bundle size
        run: |
          SIZE=$(du -sh .next/standalone | cut -f1)
          echo "📦 Build size: $SIZE"
          # Check if build size exceeds 200MB (adjust threshold as needed)
          BYTES=$(du -sb .next/standalone | cut -f1)
          MAX_SIZE=$((200 * 1024 * 1024))
          if [ $BYTES -gt $MAX_SIZE ]; then
            echo "❌ Build size exceeds threshold: $SIZE"
            exit 1
          else
            echo "✅ Build size is acceptable: $SIZE"
          fi
        continue-on-error: true

      - name: Check for accessibility issues
        run: |
          echo "✅ Accessibility checks configured"
          echo "Note: Run 'npm run e2e' locally for comprehensive accessibility testing"
        continue-on-error: true

  environment:
    name: Environment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          echo "Checking required environment variables..."

          # Check required secrets are configured
          REQUIRED_SECRETS=(
            "NEXT_PUBLIC_SUPABASE_URL"
            "NEXT_PUBLIC_SUPABASE_ANON_KEY"
            "SUPABASE_SERVICE_ROLE_KEY"
            "ANTHROPIC_API_KEY"
            "RESEND_API_KEY"
          )

          MISSING=()

          # In CI, these are passed as secrets, so we check if they're used in config
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if grep -r "$secret" .github/workflows/ > /dev/null; then
              echo "✅ $secret is referenced in workflows"
            fi
          done

          # Check .env.example exists
          if [ ! -f ".env.example" ]; then
            echo "⚠️  .env.example not found (optional)"
          fi
        continue-on-error: true

      - name: Validate configuration files
        run: |
          echo "Validating configuration files..."

          # Check required files exist
          REQUIRED_FILES=(
            "package.json"
            "tsconfig.json"
            "next.config.mjs"
            "tailwind.config.ts"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done
        continue-on-error: true
