name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]
      fail-fast: false
    # Only fail the workflow on Linux failures; macOS/Windows are informational
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DISABLE_AUTH: 'true'

      - name: Run E2E tests (Desktop browsers)
        run: npx playwright test --project=chromium --project=firefox --project=webkit
        continue-on-error: true

      - name: Run E2E tests (Mobile browsers - Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright test --project=mobile-chrome --project=mobile-safari --project=tablet
        continue-on-error: true

      - name: Run Accessibility tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright test e2e/accessibility.spec.ts --project=chromium
        continue-on-error: true

      - name: Run Visual Regression tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 30

      - name: Upload visual snapshots (Linux only)
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/__snapshots__/
          retention-days: 30

      - name: Comment PR with E2E results
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'junit-results.xml';

            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const testMatch = report.match(/tests="(\d+)"/);
              const failureMatch = report.match(/failures="(\d+)"/);

              if (testMatch && failureMatch) {
                const tests = testMatch[1];
                const failures = failureMatch[1];
                const passed = tests - failures;

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `
                  ## E2E Test Results
                  - ✅ Passed: ${passed}
                  - ❌ Failed: ${failures}
                  - 📊 Total: ${tests}

                  **Browsers tested:** Chrome, Firefox, Safari (Desktop & Mobile)
                  **Accessibility:** WCAG 2.1 AA compliance checked
                  **Visual Regression:** Screenshot comparison completed

                  [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
                  `
                })
              }
            }
        continue-on-error: true
