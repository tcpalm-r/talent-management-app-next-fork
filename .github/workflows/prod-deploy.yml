name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          AI_INTRANET_URL: ${{ secrets.AI_INTRANET_URL }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

  deploy-talent-management:
    name: Deploy Talent Management to Vercel
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment:
      name: production-talent-management
      url: https://talent-management-next.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Talent Management)
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_TALENT_MGMT }}
          prod: true

  deploy-employee-assessment:
    name: Deploy Employee Self-Assessment to Vercel
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment:
      name: production-employee-assessment
      url: https://employee-self-assessment.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Employee Self-Assessment)
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ASSESSMENT }}
          prod: true

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-talent-management, deploy-employee-assessment]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-talent-management.result }}" == "success" ] && [ "${{ needs.deploy-employee-assessment.result }}" == "success" ]; then
            echo "✅ Both deployments succeeded!"
            exit 0
          else
            echo "❌ One or more deployments failed"
            exit 1
          fi
