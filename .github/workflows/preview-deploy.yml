name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DISABLE_AUTH: 'true'

      - name: Setup deployment (Vercel)
        id: deploy
        run: |
          echo "Preview deployment configured"
          echo "url=https://preview-${{ github.head_ref || github.ref_name }}.example.com" >> $GITHUB_OUTPUT

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              🚀 **Preview Deployment Ready**

              Your changes have been built and are ready for preview.

              ### Preview Details
              - **Branch:** ${{ github.head_ref }}
              - **Commit:** ${{ github.event.pull_request.head.sha }}
              - **Status:** ✅ Build Successful

              ### Testing Checklist
              - [ ] Test core 360 survey workflow
              - [ ] Verify employee list functionality
              - [ ] Check dashboard displays correctly
              - [ ] Test form submissions
              - [ ] Verify error handling

              **Note:** To deploy a preview, configure Vercel, Netlify, or similar service.
              See [DEPLOYMENT.md](https://github.com/${{ github.repository }}/wiki/Deployment) for instructions.
              `
            })
        continue-on-error: true

  validate-build:
    name: Validate Build Artifacts
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DISABLE_AUTH: 'true'

      - name: Check build artifacts
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build artifacts generated"
            ls -lh .next | head -10
          else
            echo "❌ Build artifacts not found"
            exit 1
          fi

      - name: Generate build report
        run: |
          echo "# Build Report" > build-report.md
          echo "" >> build-report.md
          echo "## Build Artifacts" >> build-report.md
          echo "\`\`\`" >> build-report.md
          du -sh .next >> build-report.md
          echo "\`\`\`" >> build-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
