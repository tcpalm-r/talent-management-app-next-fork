name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to HEAD \
            --verbose
        continue-on-error: true

      - name: Comment on PR if violations found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              ⚠️ **Commit Message Validation Failed**

              Please ensure your commit messages follow [Conventional Commits](https://www.conventionalcommits.org/) format:

              \`\`\`
              <type>(<scope>): <subject>

              <body>

              <footer>
              \`\`\`

              **Valid types:**
              - feat: A new feature
              - fix: A bug fix
              - docs: Documentation only
              - style: Code style changes
              - refactor: Code refactoring
              - perf: Performance improvements
              - test: Test additions/updates
              - ci: CI/CD changes
              - chore: Other changes

              **Example:**
              \`feat(360-surveys): add survey export functionality\`
              `
            })
        continue-on-error: true
